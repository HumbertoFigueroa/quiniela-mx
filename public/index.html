<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1f15">
<title>Quiniela Liga MX</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- ===== Login ===== -->
<div id="view-login" class="view login-view hidden">
  <div class="login-card">
    <div class="logo">⚽</div>
    <h1>Quiniela<br><span>Liga MX</span></h1>
    <div class="tabs">
      <button id="tab-login" class="tab active">Entrar</button>
      <button id="tab-register" class="tab">Registrarme</button>
    </div>
    <form id="auth-form">
      <label>Apodo
        <input id="auth-nick" type="text" maxlength="20" autocomplete="username" placeholder="Tu apodo en el grupo" required>
      </label>
      <label>PIN (4 dígitos)
        <input id="auth-pin" type="password" inputmode="numeric" pattern="\d{4}" maxlength="4" autocomplete="current-password" placeholder="••••" required>
      </label>
      <button type="submit" class="btn-primary" id="auth-submit">Entrar</button>
      <p id="auth-error" class="error"></p>
    </form>
  </div>
</div>

<!-- ===== App shell ===== -->
<div id="app" class="hidden">
  <header>
    <div class="header-title">⚽ Quiniela <b>Liga MX</b></div>
    <div class="header-actions">
      <button id="btn-notif" title="Notificaciones">🔔</button>
      <button id="btn-logout" title="Salir">⏻</button>
    </div>
  </header>

  <main id="main"></main>

  <nav id="nav">
    <button data-view="live" class="active"><span>🏟️</span>Jornada</button>
    <button data-view="picks"><span>✏️</span>Mi quiniela</button>
    <button data-view="season"><span>📊</span>Temporada</button>
    <button data-view="admin" id="nav-admin" class="hidden"><span>⚙️</span>Admin</button>
  </nav>
</div>

<div id="toast" class="hidden"></div>
<script src="/app.js"></script>
</body>
</html>
