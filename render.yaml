# Blueprint de Render: crea el servicio con disco persistente y variables listas.
# En render.com: New + -> Blueprint -> seleccionar este repositorio.
services:
  - type: web
    name: quiniela-liga-mx
    runtime: node
    plan: starter          # plan de paga (~$7 USD/mes) requerido para disco persistente
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATA_DIR
        value: /data
    disk:
      name: quiniela-data
      mountPath: /data
      sizeGB: 1
